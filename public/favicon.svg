<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8FA3"/>
      <stop offset="100%" stop-color="#7B5CFF"/>
    </linearGradient>
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#2B2147" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="30" fill="#EEE7FB"/>
  <g filter="url(#clayShadow)">
    <circle cx="50" cy="50" r="32" fill="url(#bgG)"/>
    <!-- Flower petals -->
    <ellipse cx="50" cy="36" rx="9" ry="16" fill="#FFF"/>
    <ellipse cx="50" cy="64" rx="9" ry="16" fill="#FFF"/>
    <ellipse cx="36" cy="50" rx="16" ry="9" fill="#FFF"/>
    <ellipse cx="64" cy="50" rx="16" ry="9" fill="#FFF"/>
    <!-- Center bud -->
    <circle cx="50" cy="50" r="10" fill="#FFB86B"/>
    <circle cx="50" cy="50" r="6" fill="#FF8FA3"/>
  </g>
</svg>
