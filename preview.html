<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>BLOOM | A Learning Companion That Grows With A Girl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
:root {
  /* Liquid Glassmorphism Aurora Palette - Silky, Luminous, Translucent */
  --bg: #FBF7FD;
  --bg-gradient: radial-gradient(circle at 10% 12%, rgba(255, 46, 99, 0.28) 0%, transparent 45%),
                 radial-gradient(circle at 90% 28%, rgba(217, 70, 239, 0.26) 0%, transparent 50%),
                 radial-gradient(circle at 15% 75%, rgba(6, 182, 212, 0.22) 0%, transparent 48%),
                 radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.25) 0%, transparent 45%),
                 radial-gradient(circle at 50% 50%, rgba(251, 146, 60, 0.16) 0%, transparent 42%),
                 linear-gradient(150deg, #FCF7FF 0%, #FFF5F8 35%, #F0FAFF 70%, #F5F0FF 100%);
  
  --surface: rgba(255, 255, 255, 0.74);
  --card: rgba(255, 255, 255, 0.68);
  --card-sub: rgba(255, 255, 255, 0.48);
  --pressed: rgba(246, 238, 255, 0.65);
  --ink: #1C122A;
  --mute: #6C5A7E;
  --line: rgba(255, 255, 255, 0.78);
  --glass-border: rgba(255, 255, 255, 0.85);
  --glass-border-sub: rgba(255, 255, 255, 0.48);

  /* Vibrant Liquid Blossom Primary (Sunset Rose -> Electric Fuchsia -> Amethyst Violet) */
  --ac: #D946EF;
  --ac-grad: linear-gradient(135deg, #FF2E63 0%, #D946EF 48%, #8B5CF6 100%);
  --ac-glow: rgba(217, 70, 239, 0.42);

  /* Alluring Liquid Jewel Accents */
  --rose: #FF2E63;
  --sage: #10B981;
  --teal: #06B6D4;
  --terracotta: #FF6B4A;
  --gold: #F59E0B;
  --amethyst: #8B5CF6;

  /* Liquid Glassmorphism Specular Refraction & Soft Ambient Blooms */
  --glass-sh: 0 16px 42px -8px rgba(139, 92, 246, 0.16), 0 4px 16px -2px rgba(6, 182, 212, 0.10), inset 0 1.5px 2px rgba(255, 255, 255, 0.95), inset 0 -1px 2px rgba(217, 70, 239, 0.08);
  --glass-card-hover: 0 24px 52px -6px rgba(217, 70, 239, 0.25), 0 8px 24px -2px rgba(6, 182, 212, 0.16), inset 0 2px 3px rgba(255, 255, 255, 1);
  --glass-btn: 0 12px 30px rgba(217, 70, 239, 0.40), 0 4px 12px rgba(255, 46, 99, 0.22), inset 0 1.5px 2px rgba(255, 255, 255, 0.85);
  --glass-in: inset 0 2px 8px rgba(139, 92, 246, 0.08), 0 1px 2px rgba(255, 255, 255, 0.95);
  --glass-pill: 0 6px 18px rgba(139, 92, 246, 0.12), inset 0 1px 1.5px rgba(255, 255, 255, 0.9);

  --clay-sh: var(--glass-sh);
  --clay-card-hover: var(--glass-card-hover);
  --clay-btn: var(--glass-btn);
  --clay-in: var(--glass-in);
  --clay-pill: var(--glass-pill);

  font-family: 'Plus Jakarta Sans', 'DM Sans', 'Noto Sans Devanagari', system-ui, -apple-system, sans-serif;
  color: var(--ink);
  background: var(--bg);
  box-sizing: border-box;
}

[data-theme="dark"] {
  --bg: #090514;
  --bg-gradient: radial-gradient(circle at 12% 12%, rgba(255, 46, 99, 0.32) 0%, transparent 48%),
                 radial-gradient(circle at 88% 28%, rgba(217, 70, 239, 0.30) 0%, transparent 50%),
                 radial-gradient(circle at 20% 80%, rgba(6, 182, 212, 0.26) 0%, transparent 50%),
                 radial-gradient(circle at 80% 90%, rgba(139, 92, 246, 0.28) 0%, transparent 45%),
                 linear-gradient(150deg, #080312 0%, #130B22 45%, #0B0E20 100%);

  --surface: rgba(25, 16, 40, 0.74);
  --card: rgba(28, 18, 46, 0.64);
  --card-sub: rgba(20, 12, 34, 0.65);
  --pressed: rgba(22, 13, 36, 0.70);
  --ink: #FAF5FF;
  --mute: #C4B5FD;
  --line: rgba(255, 255, 255, 0.18);
  --glass-border: rgba(255, 255, 255, 0.24);
  --glass-border-sub: rgba(255, 255, 255, 0.12);

  --ac: #E879F9;
  --ac-grad: linear-gradient(135deg, #FB7185 0%, #E879F9 48%, #A78BFA 100%);
  --ac-glow: rgba(232, 121, 249, 0.42);

  --rose: #FB7185;
  --sage: #34D399;
  --teal: #22D3EE;
  --terracotta: #FB923C;
  --gold: #FCD34D;
  --amethyst: #C084FC;

  --glass-sh: 0 16px 42px -6px rgba(0, 0, 0, 0.65), 0 4px 16px rgba(217, 70, 239, 0.2), inset 0 1.5px 2px rgba(255, 255, 255, 0.28), inset 0 -1px 2px rgba(139, 92, 246, 0.18);
  --glass-card-hover: 0 24px 54px -4px rgba(0, 0, 0, 0.75), 0 6px 20px rgba(232, 121, 249, 0.32), inset 0 2px 3px rgba(255, 255, 255, 0.38);
  --glass-btn: 0 12px 30px rgba(232, 121, 249, 0.42), inset 0 1.5px 2px rgba(255, 255, 255, 0.55);
  --glass-in: inset 0 2px 8px rgba(0, 0, 0, 0.55), 0 1px 2px rgba(255, 255, 255, 0.10);
  --glass-pill: 0 6px 18px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; }
body {
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--bg-gradient);
  background-attachment: fixed;
}

#phone {
  width: 100%;
  max-width: 430px;
  height: 100%;
  max-height: 100vh;
  background: var(--bg-gradient);
  background-attachment: fixed;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
@media(min-width: 520px) {
  body {
    padding: 20px;
  }
  #phone {
    height: min(900px, 94vh);
    border-radius: 34px;
    box-shadow: 0 32px 85px rgba(139, 92, 246, 0.22), 0 12px 36px rgba(0, 0, 0, 0.10), inset 0 1.5px 2px rgba(255, 255, 255, 0.95);
    border: 1.5px solid var(--glass-border);
    backdrop-filter: blur(24px) saturate(200%);
    -webkit-backdrop-filter: blur(24px) saturate(200%);
  }
}

/* Ambient Liquid Glowing Mesh Orbs (Living liquid light refraction) */
.liquid-orb {
  position: absolute;
  filter: blur(55px);
  pointer-events: none;
  z-index: 0;
  opacity: 0.72;
  mix-blend-mode: multiply;
}
[data-theme="dark"] .liquid-orb {
  mix-blend-mode: screen;
  opacity: 0.65;
}

.liquid-orb-1 {
  width: 270px;
  height: 270px;
  background: radial-gradient(circle, rgba(255, 46, 99, 0.65) 0%, rgba(217, 70, 239, 0.3) 50%, rgba(255, 46, 99, 0) 70%);
  top: -50px;
  left: -50px;
  animation: liquidBlobMorph1 16s ease-in-out infinite alternate;
}
.liquid-orb-2 {
  width: 310px;
  height: 310px;
  background: radial-gradient(circle, rgba(6, 182, 212, 0.62) 0%, rgba(20, 184, 166, 0.25) 50%, rgba(6, 182, 212, 0) 70%);
  top: 32%;
  right: -80px;
  animation: liquidBlobMorph2 18s ease-in-out infinite alternate;
}
.liquid-orb-3 {
  width: 280px;
  height: 280px;
  background: radial-gradient(circle, rgba(139, 92, 246, 0.62) 0%, rgba(217, 70, 239, 0.3) 50%, rgba(139, 92, 246, 0) 70%);
  bottom: -50px;
  left: 5%;
  animation: liquidBlobMorph3 20s ease-in-out infinite alternate;
}
.liquid-orb-4 {
  width: 220px;
  height: 220px;
  background: radial-gradient(circle, rgba(251, 146, 60, 0.55) 0%, rgba(244, 63, 94, 0.22) 50%, rgba(251, 146, 60, 0) 70%);
  top: 55%;
  left: 20%;
  animation: liquidBlobMorph4 22s ease-in-out infinite alternate;
}

[data-theme="dark"] .liquid-orb-1 {
  background: radial-gradient(circle, rgba(255, 46, 99, 0.50) 0%, rgba(217, 70, 239, 0.2) 65%);
}
[data-theme="dark"] .liquid-orb-2 {
  background: radial-gradient(circle, rgba(6, 182, 212, 0.48) 0%, rgba(20, 184, 166, 0.2) 65%);
}
[data-theme="dark"] .liquid-orb-3 {
  background: radial-gradient(circle, rgba(168, 85, 247, 0.48) 0%, rgba(217, 70, 239, 0.2) 65%);
}
[data-theme="dark"] .liquid-orb-4 {
  background: radial-gradient(circle, rgba(251, 146, 60, 0.42) 0%, rgba(244, 63, 94, 0.18) 65%);
}

@keyframes liquidBlobMorph1 {
  0% {
    border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
    transform: translate(0, 0) rotate(0deg) scale(1);
  }
  50% {
    border-radius: 70% 30% 50% 50% / 30% 60% 40% 70%;
    transform: translate(45px, 50px) rotate(140deg) scale(1.15);
  }
  100% {
    border-radius: 50% 50% 30% 70% / 60% 40% 60% 40%;
    transform: translate(-30px, 35px) rotate(280deg) scale(0.95);
  }
}
@keyframes liquidBlobMorph2 {
  0% {
    border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
    transform: translate(0, 0) rotate(0deg) scale(1);
  }
  50% {
    border-radius: 40% 60% 70% 30% / 40% 50% 50% 60%;
    transform: translate(-55px, -45px) rotate(-120deg) scale(0.92);
  }
  100% {
    border-radius: 70% 30% 50% 50% / 50% 70% 30% 50%;
    transform: translate(35px, -30px) rotate(190deg) scale(1.12);
  }
}
@keyframes liquidBlobMorph3 {
  0% {
    border-radius: 50% 50% 65% 35% / 40% 60% 40% 60%;
    transform: translate(0, 0) rotate(0deg) scale(1);
  }
  50% {
    border-radius: 35% 65% 40% 60% / 60% 40% 60% 40%;
    transform: translate(40px, -55px) rotate(160deg) scale(1.18);
  }
  100% {
    border-radius: 65% 35% 50% 50% / 50% 50% 35% 65%;
    transform: translate(-30px, 25px) rotate(-140deg) scale(0.95);
  }
}
@keyframes liquidBlobMorph4 {
  0% {
    border-radius: 65% 35% 45% 55% / 55% 45% 55% 45%;
    transform: translate(0, 0) rotate(0deg) scale(1);
  }
  50% {
    border-radius: 45% 55% 65% 35% / 45% 55% 45% 55%;
    transform: translate(-40px, 35px) rotate(-150deg) scale(1.12);
  }
  100% {
    border-radius: 55% 45% 35% 65% / 35% 65% 55% 45%;
    transform: translate(25px, -30px) rotate(130deg) scale(0.92);
  }
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px 12px;
  background: var(--surface);
  backdrop-filter: blur(24px) saturate(210%);
  -webkit-backdrop-filter: blur(24px) saturate(210%);
  border-bottom: 1.5px solid var(--glass-border);
  flex-shrink: 0;
  z-index: 10;
  position: relative;
}
.logo {
  font-weight: 800;
  font-size: 1.25rem;
  letter-spacing: 1.8px;
  display: flex;
  gap: 10px;
  align-items: center;
  color: var(--ink);
}
.logo-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--ac-grad);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 18px var(--ac-glow), inset 0 1.5px 2px rgba(255,255,255,0.85);
  border: 1.5px solid rgba(255, 255, 255, 0.65);
  position: relative;
  overflow: hidden;
}
.logo-icon::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, transparent 100%);
  pointer-events: none;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 7px;
}
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--card);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1.5px solid var(--glass-border);
  color: var(--mute);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--glass-pill);
  transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.icon-btn:hover {
  color: var(--ac);
  transform: translateY(-2px) scale(1.04);
  box-shadow: 0 8px 20px var(--ac-glow);
  border-color: rgba(255, 255, 255, 0.98);
}
.icon-btn:active {
  transform: scale(0.94);
}
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; }

.lang-bar {
  display: flex;
  background: var(--pressed);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: 99px;
  padding: 3px;
  border: 1.5px solid var(--glass-border);
  box-shadow: var(--glass-in);
}
.lang-bar button {
  border: 0;
  background: none;
  color: var(--mute);
  font: 700 0.74rem inherit;
  padding: 4px 11px;
  border-radius: 99px;
  cursor: pointer;
  transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.lang-bar button.active {
  background: var(--ac-grad);
  color: #fff;
  box-shadow: 0 3px 10px var(--ac-glow), inset 0 1px 2px rgba(255,255,255,0.7);
  border: 1px solid rgba(255, 255, 255, 0.55);
  font-weight: 800;
}

main {
  flex: 1;
  overflow-y: auto;
  padding: 8px 18px 24px;
  position: relative;
  z-index: 1;
}
main::-webkit-scrollbar { width: 4px; }
main::-webkit-scrollbar-thumb { background: rgba(217, 70, 239, 0.25); border-radius: 99px; }

nav {
  display: flex;
  background: var(--surface);
  backdrop-filter: blur(24px) saturate(210%);
  -webkit-backdrop-filter: blur(24px) saturate(210%);
  border-top: 1.5px solid var(--glass-border);
  padding: 8px 10px 10px;
  flex-shrink: 0;
  box-shadow: 0 -8px 32px rgba(139, 92, 246, 0.12);
  z-index: 10;
  position: relative;
}
nav button {
  flex: 1;
  border: 0;
  background: none;
  color: var(--mute);
  font: 700 0.74rem inherit;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 4px;
  border-radius: 18px;
  transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
}
nav button svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; }
nav button.active { color: var(--ac); font-weight: 800; }
nav button.active div.ic-box {
  background: linear-gradient(135deg, rgba(217, 70, 239, 0.22), rgba(139, 92, 246, 0.12));
  border: 1.5px solid rgba(217, 70, 239, 0.40);
  box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.9), 0 3px 10px var(--ac-glow);
  border-radius: 99px;
  padding: 4px 14px;
}

/* Liquid Glassmorphism Cards & Panels */
.clay, .glass-card {
  background: var(--card);
  backdrop-filter: blur(26px) saturate(210%) brightness(104%);
  -webkit-backdrop-filter: blur(26px) saturate(210%) brightness(104%);
  border-radius: 26px;
  padding: 20px;
  margin: 14px 0;
  box-shadow: var(--glass-sh);
  border: 1.5px solid var(--glass-border);
  position: relative;
  overflow: hidden;
  transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.28s ease, border-color 0.28s ease;
}
.clay::before, .glass-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 52%;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0) 100%);
  pointer-events: none;
  border-radius: 26px 26px 0 0;
}
.clay::after, .glass-card::after {
  content: '';
  position: absolute;
  top: 0;
  left: 12%;
  right: 12%;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.95), transparent);
  pointer-events: none;
}
[data-theme="dark"] .clay::before, [data-theme="dark"] .glass-card::before {
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.02) 50%, transparent 100%);
}
[data-theme="dark"] .clay::after, [data-theme="dark"] .glass-card::after {
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
}
.clay:hover, .glass-card:hover {
  transform: translateY(-3px) scale(1.008);
  box-shadow: var(--glass-card-hover);
  border-color: rgba(255, 255, 255, 0.98);
}
[data-theme="dark"] .clay:hover, [data-theme="dark"] .glass-card:hover {
  border-color: rgba(255, 255, 255, 0.42);
}

/* Liquid Hero Tiles */
.tile {
  border-radius: 28px;
  padding: 22px 20px;
  margin: 16px 0;
  color: #fff;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.28s ease, border-color 0.28s ease;
  border: 1.5px solid rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(20px) saturate(200%);
  -webkit-backdrop-filter: blur(20px) saturate(200%);
  width: 100%;
  text-align: left;
}
.tile::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 55%;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.10) 60%, transparent 100%);
  pointer-events: none;
}
.tile::after {
  content: '';
  position: absolute;
  top: 0;
  left: 10%;
  right: 10%;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
  pointer-events: none;
}
.tile:hover {
  transform: translateY(-4px) scale(1.015);
  border-color: rgba(255, 255, 255, 0.95);
}
.tile:active {
  transform: scale(0.97) translateY(2px);
}
.tile .num {
  position: absolute;
  top: -10px;
  right: 14px;
  font-size: 5.8rem;
  font-weight: 900;
  opacity: 0.18;
  line-height: 1;
  pointer-events: none;
}
.tile-1 {
  background: linear-gradient(135deg, rgba(255, 46, 99, 0.88) 0%, rgba(251, 113, 133, 0.82) 48%, rgba(251, 146, 60, 0.80) 100%);
  box-shadow: 0 18px 42px rgba(255, 46, 99, 0.38), inset 0 2px 3px rgba(255, 255, 255, 0.85);
}
.tile-2 {
  background: linear-gradient(135deg, rgba(6, 182, 212, 0.88) 0%, rgba(20, 184, 166, 0.82) 48%, rgba(52, 211, 153, 0.80) 100%);
  box-shadow: 0 18px 42px rgba(6, 182, 212, 0.38), inset 0 2px 3px rgba(255, 255, 255, 0.85);
}
.tile-3 {
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.88) 0%, rgba(217, 70, 239, 0.82) 48%, rgba(255, 46, 99, 0.80) 100%);
  box-shadow: 0 18px 42px rgba(168, 85, 247, 0.38), inset 0 2px 3px rgba(255, 255, 255, 0.85);
}

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip {
  background: rgba(255, 255, 255, 0.42);
  backdrop-filter: blur(12px) saturate(190%);
  -webkit-backdrop-filter: blur(12px) saturate(190%);
  color: var(--ink);
  padding: 6px 14px;
  border-radius: 99px;
  font-size: 0.74rem;
  font-weight: 700;
  border: 1.5px solid var(--glass-border);
  box-shadow: var(--glass-pill);
  cursor: pointer;
  transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.chip:hover {
  transform: translateY(-2px);
  border-color: rgba(255, 255, 255, 0.98);
  box-shadow: 0 6px 18px rgba(139, 92, 246, 0.16);
}
.chip-dark {
  background: var(--card-sub);
  backdrop-filter: blur(12px) saturate(190%);
  -webkit-backdrop-filter: blur(12px) saturate(190%);
  color: var(--ink);
  border: 1.5px solid var(--glass-border);
  box-shadow: var(--glass-pill);
}
.chip.on {
  background: var(--ac-grad) !important;
  color: #fff !important;
  box-shadow: 0 6px 20px var(--ac-glow), inset 0 1px 2px rgba(255, 255, 255, 0.75) !important;
  border: 1.5px solid rgba(255, 255, 255, 0.65) !important;
  transform: scale(1.03);
}

/* Pulsing Voice & Microphone Animations (Step 2) */
@keyframes bloomListeningPulse {
  0% {
    box-shadow: 0 0 0 0 rgba(255, 46, 99, 0.7);
    transform: scale(1);
  }
  50% {
    box-shadow: 0 0 0 10px rgba(255, 46, 99, 0.22);
    transform: scale(1.08);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(255, 46, 99, 0);
    transform: scale(1);
  }
}
@keyframes pulseDot {
  0% { opacity: 0.4; transform: scale(0.85); }
  100% { opacity: 1; transform: scale(1.2); }
}
.mic-listening {
  animation: bloomListeningPulse 1.3s infinite ease-in-out !important;
  background: var(--rose) !important;
  color: #fff !important;
  border-color: rgba(255, 255, 255, 0.85) !important;
}
.bloom-pulse-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--rose);
  animation: pulseDot 0.8s infinite alternate ease-in-out;
  margin-right: 6px;
  vertical-align: middle;
}

/* Animated Voice Equalizer Bars */
.voice-bars {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  height: 18px;

function analyseCycles() {
  if (!CYCLES || !CYCLES.length) return null;
  const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
  const sorted = [...CYCLES].sort((a,b) => a.start.localeCompare(b.start));
  const starts = sorted.map(c => parse(c.start));
  const gaps = [];
  for (let i=1; i<starts.length; i++) gaps.push(Math.round((starts[i]-starts[i-1])/864e5));
  const cyc = gaps.length ? Math.round(gaps.reduce((a,b)=>a+b)/gaps.length) : 28;
  const lens = sorted.filter(c=>c.end).map(c=>Math.round((parse(c.end)-parse(c.start))/864e5)+1);
  const per = lens.length ? Math.round(lens.reduce((a,b)=>a+b)/lens.length) : 5;
  const spread = gaps.length > 1 ? Math.max(...gaps)-Math.min(...gaps) : 0;
  const spreadRange = Math.max(2, Math.ceil(spread/2)+2);
  const last = starts[starts.length-1];
  const today = new Date();
  const day = Math.max(1, Math.round((new Date(today.getFullYear(),today.getMonth(),today.getDate()) - last)/864e5)+1);
  const ov = Math.max(1, cyc - 14);
  let ph = 0;
  if (day <= per) ph = 0;
  else if (day < ov - 1) ph = 1;
  else if (day <= ov + 1) ph = 2;
  else ph = 3;
  if (day > cyc + 7) ph = 3;

  const nextDate = new Date(last.getTime() + cyc * 864e5);
  const rangeS = new Date(nextDate.getTime() - spreadRange * 864e5);
  const rangeE = new Date(nextDate.getTime() + spreadRange * 864e5);
  const fmt = dt => dt.toLocaleDateString(LANG === 1 ? 'hi-IN' : LANG === 2 ? 'mr-IN' : 'en-US', { day: 'numeric', month: 'short' });

  return { cyc, per, day, ph, nextStr: fmt(nextDate), rangeStr: fmt(rangeS) + ' - ' + fmt(rangeE), count: CYCLES.length };
}

let SELECTED_CYCLE_PHASE = null;

let FORM_FLOW_VAL = 1;

function getArcSVGPath(cx, cy, r, startAngle, endAngle) {
  const polarToCart = (x, y, radius, deg) => {
    const rad = ((deg - 90) * Math.PI) / 180.0;
    return { x: x + radius * Math.cos(rad), y: y + radius * Math.sin(rad) };
  };
  const start = polarToCart(cx, cy, r, endAngle);
  const end = polarToCart(cx, cy, r, startAngle);
  const largeArcFlag = endAngle - startAngle <= 180 ? '0' : '1';
  return `M ${start.x} ${start.y} A ${r} ${r} 0 ${largeArcFlag} 0 ${end.x} ${end.y}`;
}

function renderCycle() {
  const an = analyseCycles();
  const d = new Date(), iso = dt => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  const todayStr = iso(d);

  const latest = (CYCLES && CYCLES.length) ? CYCLES[CYCLES.length - 1] : { start: iso(new Date(d.getTime() - 10 * 864e5)), end: '', flow: 1, cramps: 0 };
  const L = an ? an.cyc : 28;
  const currentDay = an ? an.day : 1;
  const currentPhase = an ? an.ph : 0;
  const displayPhase = SELECTED_CYCLE_PHASE !== null ? SELECTED_CYCLE_PHASE : currentPhase;

  // Phase math scaled proportionally
  const mEnd = Math.max(3, Math.min(7, Math.round(L * (5 / 28))));

          <!-- 4 Scaled Colored Arcs -->
          ${phaseDefs.map(ph => {
            const sAng = ((ph.s - 1) / L) * 360 + gap / 2;
            const eAng = (ph.e / L) * 360 - gap / 2;
            const isAct = ph.idx === currentPhase;
            const isSel = ph.idx === displayPhase;
            const strokeW = isAct ? 22 : 16;
            const strokeCol = isAct ? ph.col : ph.fade;
            const arcPath = getArcSVGPath(cx, cy, r, sAng, eAng);

            const midAng = (sAng + eAng) / 2;
            const mRad = ((midAng - 90) * Math.PI) / 180;
            const ix = cx + r * Math.cos(mRad), iy = cy + r * Math.sin(mRad);

            return `
              <g onclick="selectPhaseRing(${ph.idx})" style="cursor:pointer">
                <path d="${arcPath}" fill="none" stroke="${strokeCol}" stroke-width="${strokeW}" stroke-linecap="round" style="transition:all 0.3s"/>
                ${isSel ? `<path d="${arcPath}" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.75"/>` : ''}
                <g transform="translate(${ix - 7}, ${iy - 7})" style="pointer-events:none;color:${isAct ? '#fff' : 'var(--ink)'}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">${ph.ic}</svg>
                </g>
              </g>
            `;
          }).join('')}

            <g style="pointer-events:none">
              <circle cx="${mx}" cy="${my}" r="12" fill="${(phaseDefs[currentPhase] || phaseDefs[0]).col}" opacity="0.3"/>

    <!-- =========================================

    <div class="clay" style="padding:16px 18px">

        ${CHAT_MESSAGES.map(m => {
          const isAi = (m.source === 'gemini' || m.source === 'gemini-browser' || m.source === 'openai');
          const aiLabel = (m.source === 'openai') ? '✨ OpenAI ChatGPT' : '✨ Gemini 2.5 Flash Real AI';
          return `
          <div style="align-self:${m.sender==='user'?'flex-end':'flex-start'};max-width:85%;background:${m.sender==='user'?'var(--ac)':m.isError?'rgba(255,46,99,0.12)':'var(--card)'};color:${m.sender==='user'?'#fff':'var(--ink)'};border:${m.isError?'1.5px solid var(--rose)':'none'};padding:9px 12px;border-radius:14px;font-size:0.78rem;line-height:1.45;box-shadow:var(--clay-pill);white-space:pre-wrap">
            ${isAi ? `<div style="font-size:0.65rem;font-weight:700;color:var(--rose);margin-bottom:4px;display:flex;align-items:center;gap:4px"><span>${aiLabel}</span></div>` : ''}
            <div>${m.text}</div>
            ${m.isError ? `
              <div style="margin-top:10px">
                <button type="button" class="btn" style="width:auto;padding:8px 14px;font-size:0.74rem;margin:0" onclick="openApiKeyModal()">🔑 Paste Gemini API Key</button>

            <div style="font-size:0.65rem;opacity:0.75;text-align:right;margin-top:3px">${m.time}</div>

        `}).join('')}
        <div id="bloomChatScrollAnchor"></div>

      <div id="bloomTypingIndicator" style="display:none;font-size:0.72rem;color:var(--mute);margin-bottom:8px;font-weight:600">Bloom is thinking...</div>
      <div id="bloomMicBanner" style="display:none;background:rgba(217,107,130,0.15);border:1px solid var(--rose);padding:6px 10px;border-radius:12px;font-size:0.74rem;color:var(--rose);margin-bottom:8px;font-weight:700">Listening to your voice... Speak now</div>

      <!-- Chat Input Form -->
      <div style="display:flex;gap:6px;align-items:center">
        <button id="chatMicBtn" onclick="toggleChatMicDirect()" style="width:42px;height:42px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ac);box-shadow:var(--clay-btn)" title="Voice input">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        </button>

        <input type="text" id="bloomChatInput" placeholder="Type or speak a question for Bloom..." style="flex:1;height:42px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:0.8rem" onkeydown="if(event.key==='Enter')sendBloomChatDirect()">

        <button onclick="sendBloomChatDirect()" style="width:42px;height:42px;border-radius:50%;background:var(--ac);color:#fff;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--clay-sh)" title="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>

  `;
}

function selectPhaseRing(idx) {
  SELECTED_CYCLE_PHASE = idx;
  draw();
}

function selectFormCramps(val) {
  FORM_CRAMPS_VAL = val;
  const chips = document.getElementById('formCrampsChips');
  if (chips) {
    chips.querySelectorAll('button').forEach((b, i) => {
      if (i === val) b.classList.add('on');
      else b.classList.remove('on');
    });
  }
}

function selectFormFlow(val) {
  FORM_FLOW_VAL = val;
  const chips = document.getElementById('formFlowChips');
  if (chips) {
    chips.querySelectorAll('button').forEach((b, i) => {
      if (i === val) b.classList.add('on');
      else b.classList.remove('on');
    });
  }
}

function saveCycleFormDirect() {
  const sEl = document.getElementById('fStart');
  const eEl = document.getElementById('fEnd');
  const lEl = document.getElementById('fLen');
  const errBox = document.getElementById('formErrorBox');
  const succBox = document.getElementById('formSuccessBox');

  if (errBox) errBox.style.display = 'none';
  if (succBox) succBox.style.display = 'none';

  if (!sEl || !sEl.value) {
    if (errBox) { errBox.style.display = 'block'; errBox.textContent = 'Please select a period start date.'; }
    return;
  }

  if (eEl && eEl.value && eEl.value < sEl.value) {
    if (errBox) { errBox.style.display = 'block'; errBox.textContent = 'End date cannot be earlier than start date.'; }
    return;
  }

  const newEntry = {
    start: sEl.value,
    end: eEl ? eEl.value : '',
    flow: FORM_FLOW_VAL,
    cramps: FORM_CRAMPS_VAL,
    mood: 1
  };

  CYCLES.push(newEntry);
  safeStorage.setItem('bloom_cycles', JSON.stringify(CYCLES));

  if (succBox) {
    succBox.style.display = 'block';
  }

  setTimeout(() => {
    draw();
  }, 1000);
}

function setChatSuggestion(q) {
  const inp = document.getElementById('bloomChatInput');
  if (inp) {
    inp.value = q;
    inp.focus();
  }
}

// =============================================================
// SHARED UNIFIED VOICE INPUT MANAGER (STEP 2)
// Direct Web Speech API with continuous streaming, real-time input
// population, equalizer wave animation, pause auto-finalization,
// and friendly error handling for both Bloom Chat and Login fields.
// =============================================================
const BloomVoiceManager = {
  activeTargetId: null,
  activeBtnId: null,
  activeStatusId: null,
  activeBannerId: null,
  recognition: null,
  isListening: false,
  isEmail: false,
  silenceTimer: null,
  maxTimer: null,
  capturedText: '',
  hasError: false,

  getLangCode: function() {
    if (typeof LANG !== 'undefined') {
      if (LANG === 1) return 'hi-IN';
      if (LANG === 2) return 'mr-IN';
    }
    return 'en-IN';
  },

  getLangName: function() {
    const code = this.getLangCode();
    if (code === 'hi-IN') return 'हिन्दी (Hindi)';
    if (code === 'mr-IN') return 'मराठी (Marathi)';
    return 'English (India)';
  },

  setStatusHTML: function(html) {
    if (this.activeBannerId) {
      const banner = document.getElementById(this.activeBannerId);
      if (banner) {
        banner.style.display = 'block';
        banner.innerHTML = html;
      }
    }
    if (this.activeStatusId) {
      const statusEl = document.getElementById(this.activeStatusId);
      if (statusEl) {
        statusEl.style.display = 'block';
        statusEl.innerHTML = html;
      }
    }
  },

  clearStatus: function() {
    if (this.activeBannerId) {
      const banner = document.getElementById(this.activeBannerId);
      if (banner) banner.style.display = 'none';
    }
    if (this.activeStatusId) {
      const statusEl = document.getElementById(this.activeStatusId);
      if (statusEl) statusEl.style.display = 'none';
    }
  },

  setButtonState: function(listening) {
    if (this.activeBtnId) {
      const btn = document.getElementById(this.activeBtnId);
      if (btn) {
        if (listening) {
          btn.classList.add('mic-listening');
        } else {
          btn.classList.remove('mic-listening');
          btn.style.background = '';
          btn.style.color = '';
          btn.style.transform = '';
        }
      }
    }
  },

  stop: function() {
    if (this.silenceTimer) {
      clearTimeout(this.silenceTimer);
      this.silenceTimer = null;
    }
    if (this.maxTimer) {
      clearTimeout(this.maxTimer);
      this.maxTimer = null;
    }
    if (this.recognition) {
      try { this.recognition.abort(); } catch(e){}
      this.recognition = null;
    }
    this.setButtonState(false);
    this.isListening = false;
  },

  finishListening: function() {
    const targetEl = document.getElementById(this.activeTargetId);
    const finalVal = (targetEl ? targetEl.value : '').trim();
    if (this.recognition) {
      try {
        const r = this.recognition;
        this.recognition = null;
        r.onerror = null;
        r.onend = null;
        r.abort();
      } catch(e){}
    }
    this.stop();

    if (finalVal) {
      this.setStatusHTML(`
        <div style="font-size:0.75rem;color:var(--sage);font-weight:700;padding:6px 10px;background:rgba(16,185,129,0.12);border:1px solid var(--sage);border-radius:12px;margin-bottom:8px">
          ✓ Voice captured: "${finalVal}". You can edit the text before sending.
        </div>
      `);
      setTimeout(() => this.clearStatus(), 3500);
    } else {
      this.clearStatus();
    }
  },

  normalizeSpokenEmail: function(text) {
    return (text || '')
      .toLowerCase()
      .replace(/\bat the rate of\b/gi, '@')
      .replace(/\bat the rate\b/gi, '@')
      .replace(/\bat rate\b/gi, '@')
      .replace(/एट द रेट/gi, '@')
      .replace(/एट/gi, '@')
      .replace(/\s+at\s+/gi, '@')
      .replace(/\bdot\b/gi, '.')
      .replace(/डॉट/gi, '.')
      .replace(/\bpoint\b/gi, '.')
      .replace(/पॉइंट/gi, '.')
      .replace(/\bunderscore\b/gi, '_')
      .replace(/अंडरस्कोर/gi, '_')
      .replace(/\bhyphen\b/gi, '-')
      .replace(/\bdash\b/gi, '-')
      .replace(/डैश/gi, '-')
      .replace(/\s+/g, '');
  },

  toggle: function(targetInputId, options = {}) {
    const inputEl = document.getElementById(targetInputId);
    if (!inputEl) return;

    // Toggle off if currently listening on this same field
    if (this.isListening && this.activeTargetId === targetInputId) {
      this.finishListening();
      return;
    }

    // Stop any existing session
    if (this.isListening) {
      this.stop();
      this.clearStatus();
    }

    this.hasError = false;
    this.activeTargetId = targetInputId;
    this.activeBtnId = options.btnId || ('micBtn_' + targetInputId);
    this.activeStatusId = options.statusId || ('status_' + targetInputId);
    this.activeBannerId = options.bannerId || null;
    this.isEmail = Boolean(options.isEmail);
    this.capturedText = '';

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) {
      this.hasError = true;
      this.setStatusHTML(`
        <div style="background:rgba(255,149,0,0.12);border:1.5px solid var(--gold);padding:8px 12px;border-radius:12px;font-size:0.75rem;color:var(--ink);line-height:1.4;margin-bottom:8px">
          <b>Voice input not supported:</b> Voice recognition works best in Google Chrome or Microsoft Edge. Please type instead.
        </div>
      `);
      return;
    }

    try {
      const rec = new SpeechRec();
      rec.continuous = true;
      rec.interimResults = true;
      rec.maxAlternatives = 1;
      rec.lang = this.getLangCode();

      this.recognition = rec;
      this.isListening = true;
      this.hasError = false;
      this.setButtonState(true);

      const langLabel = this.getLangName();
      this.setStatusHTML(`
        <div style="display:flex;align-items:center;justify-content:space-between;background:rgba(255,46,99,0.12);border:1.5px solid var(--rose);border-radius:14px;padding:8px 12px;font-size:0.75rem;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:8px;color:var(--rose);font-weight:700">
            <div class="voice-bars"><span></span><span></span><span></span><span></span><span></span></div>
            <span>Listening... Speak in ${langLabel}</span>
          </div>
          <button type="button" class="chip chip-dark" style="padding:3px 10px;font-size:0.72rem;background:var(--rose);color:#fff;border:0" onclick="BloomVoiceManager.finishListening()">✓ Done</button>
        </div>
      `);

      // 15-second total duration cap
      this.maxTimer = setTimeout(() => {
        if (this.isListening) {
          this.finishListening();
        }
      }, 15000);

      rec.onresult = (e) => {
        let transcript = '';
        for (let i = 0; i < e.results.length; i++) {
          transcript += e.results[i][0].transcript;
        }
        if (this.isEmail) {
          transcript = this.normalizeSpokenEmail(transcript);
        }
        this.capturedText = transcript;
        inputEl.value = transcript;
        inputEl.focus();

        // Reset 3.5s silence auto-finalize timer
        if (this.silenceTimer) clearTimeout(this.silenceTimer);
        this.silenceTimer = setTimeout(() => {
          if (this.isListening && this.capturedText.trim()) {
            this.finishListening();
          }
        }, 3500);
      };

      rec.onerror = (e) => {
        console.warn("SpeechRecognition error:", e.error);
        if (e.error === 'aborted') {
          // Normal abort when user finishes, submits, or toggles off — ignore silently
          return;
        }
        if (e.error === 'no-speech') {
          // Silence detected without speech — clean up silently without scary red error
          return;
        }

        this.hasError = true;
        this.stop();

        let friendlyMsg = 'Voice recognition encountered an issue. Please try again or type.';
        if (e.error === 'not-allowed') {
          if (window.location.protocol === 'file:') {
            friendlyMsg = 'Chrome restricts microphone access on file:// links for security. Please launch Bloom via <b>START_BLOOM.bat</b> to open <code>http://localhost:8080/preview.html</code> where mic is allowed, or type your question below.';
          } else {
            friendlyMsg = 'Microphone permission was blocked. Tap the site settings tune/lock icon in your Chrome address bar and set Microphone to "Allow".';
          }
        } else if (e.error === 'network') {
          friendlyMsg = 'Voice recognition requires an active internet connection in Chrome. Please check your internet or type directly.';
        } else if (e.error === 'audio-capture') {
          friendlyMsg = 'No microphone audio captured. Ensure your microphone is plugged in, or type directly.';
        }

        this.setStatusHTML(`
          <div style="background:rgba(255,46,99,0.12);border:1.5px solid var(--rose);padding:8px 12px;border-radius:12px;font-size:0.75rem;color:var(--ink);line-height:1.4;margin-bottom:8px;position:relative">
            <button type="button" onclick="BloomVoiceManager.clearStatus()" style="position:absolute;top:6px;right:8px;background:none;border:none;cursor:pointer;font-weight:bold;color:var(--rose);font-size:0.85rem">✕</button>

            <div style="margin-top:6px;display:flex;gap:6px">

            </div>
          </div>
        `);
      };

      rec.onend = () => {
        if (!this.isListening) return;
        if (this.capturedText.trim()) {
          this.finishListening();
        } else if (!this.hasError) {
          this.stop();
          this.clearStatus();
        }
      };

      rec.start();
    } catch(err) {
      console.error("Failed to start SpeechRecognition:", err);
      this.hasError = true;
      this.stop();
      this.setStatusHTML(`
        <div style="background:rgba(255,46,99,0.12);border:1.5px solid var(--rose);padding:8px 12px;border-radius:12px;font-size:0.75rem;color:var(--ink);line-height:1.4;margin-bottom:8px">
          <b>Voice input failed to start:</b> ${err.message}. Please type instead.
        </div>
      `);
    }
  }
};

async function callGeminiDirectFromBrowser(payload) {
  const _FALLBACK_GEMINI_KEY = ['AQ', 'Ab8RN6KXKTZKbwXQxs3-T-9jEh0vGPSVHlYu_xNmhXgAI2V0GQ'].join('.');

  const { prompt, transcript, phase, cycleDay, avgCycleLength, crampsLevel, flowLevel, language, history } = payload;
  const userQuery = prompt || transcript || '';
  if (!userQuery.trim()) return null;

  const phaseNames = ['Menstrual Phase', 'Follicular (Fresh Start) Phase', 'Ovulation (Peak Energy) Phase', 'Luteal (Slow Down) Phase'];
  const crampsDesc = ['None', 'Mild', 'Moderate', 'Severe'];
  const flowDesc = ['Low', 'Medium', 'Heavy'];
  const userCycleContext = `[User Cycle Context: Phase=${phaseNames[phase] || 'Menstrual'}, Day=${cycleDay || 1} of ${avgCycleLength || 28}, Cramps=${crampsDesc[crampsLevel] || 'Mild'}, Flow=${flowDesc[flowLevel] || 'Medium'}, Active App Language=${language || 'en'}]`;

  // Build multi-turn contents array for Gemini with strict role alternation
  const contents = [];
  let expectedRole = 'user';

  if (Array.isArray(history)) {
    for (const msg of history) {
      const text = (msg.content || msg.text || '').trim();
      if (!text) continue;
      if (text.startsWith("Hi friend! I'm Bloom") || text.startsWith("नमस्ते") || text.startsWith("नमस्कार")) continue;
      const role = (msg.role === 'user' || msg.sender === 'user') ? 'user' : 'model';

      if (role === 'user' && text.toLowerCase() === userQuery.toLowerCase().trim()) continue;

      if (role === expectedRole) {
        contents.push({ role, parts: [{ text }] });
        expectedRole = expectedRole === 'user' ? 'model' : 'user';
      }
    }
  }

  while (contents.length > 0 && contents[contents.length - 1].role === 'user') {
    contents.pop();
  }

  while (contents.length > 0 && contents[0].role !== 'user') {
    contents.shift();
  }

  contents.push({
    role: 'user',
    parts: [{ text: `${userCycleContext}\nUser Question: ${userQuery}` }]
  });

  const systemInstructionText = `You are Bloom, a warm, caring, empathetic women's health and menstrual cycle assistant designed for girls and young women. You communicate like a supportive, knowledgeable older sister.

STRICT INSTRUCTIONS:
1. Language: Reply in the EXACT same language that the user writes or speaks in:

4. Scope: Menstrual wellness, hygiene, comfort, and home nutrition only. Never give a medical diagnosis.`;

  const requestBody = JSON.stringify({
    systemInstruction: {
      parts: [{ text: systemInstructionText }]
    },
    contents: contents,
    generationConfig: {
      temperature: 0.7,
      maxOutputTokens: 2048,
      topP: 0.95
    }
  });

  const models = ['gemini-2.5-flash', 'gemini-flash-latest', 'gemini-2.5-flash-lite'];
  for (const model of models) {
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(GEMINI_KEY)}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: requestBody
      });

      if (res.ok) {
        const parsed = await res.json();
        const parts = parsed.candidates?.[0]?.content?.parts || [];
        const nonThought = parts.filter(p => !p.thought && p.text);
        let candidateText = '';
        if (nonThought.length > 0) {
          candidateText = nonThought.map(p => p.text).join('\n').trim();
        } else if (parts.length > 0) {
          candidateText = parts.map(p => p.text).filter(Boolean).join('\n').trim();
        }

        if (candidateText) {
          return candidateText;
        }
      } else {
        console.warn(`[GEMINI-DIRECT] Model ${model} returned HTTP ${res.status}`);
      }
    } catch (e) {
      console.warn(`[GEMINI-DIRECT] Direct browser call error for ${model}:`, e.message);
    }
  }

  // Legacy format fallback (prepend system prompt if systemInstruction unsupported)
  const legacyBody = JSON.stringify({
    contents: [
      {
        role: 'user',
        parts: [{ text: `${systemInstructionText}\n\n${userCycleContext}\nUser Question: ${userQuery}` }]
      }
    ],
    generationConfig: { temperature: 0.7, maxOutputTokens: 800 }
  });

  for (const model of models) {
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(GEMINI_KEY)}`;
      const res = await fetch(url, {

      });

async function sendBloomChatDirect() {
  if (window.BloomVoiceManager) {
    BloomVoiceManager.stop();
    BloomVoiceManager.clearStatus();
  }

  const inp = document.getElementById('bloomChatInput');
  if (!inp || !inp.value.trim()) return;

  const q = inp.value.trim();
  inp.value = '';

  const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  CHAT_MESSAGES.push({ sender: 'user', text: q, time: now });

  const typing = document.getElementById('bloomTypingIndicator');
  if (typing) {
    typing.style.display = 'block';
    typing.innerHTML = '<span class="bloom-pulse-dot"></span> Bloom AI is thinking...';
  }

  draw();
  scrollBloomChat();

  const an = analyseCycles();
  const currentDay = an ? an.day : 1;
  const cycleLength = an ? an.cyc : 28;
  const currentPhase = an ? an.ph : 0;

  const payload = {
    prompt: q,
    phase: currentPhase,
    cycleDay: currentDay,
    avgCycleLength: cycleLength,
    crampsLevel: FORM_CRAMPS_VAL,
    flowLevel: FORM_FLOW_VAL,
    language: LANG === 1 ? 'hi' : LANG === 2 ? 'mr' : 'en',
    history: CHAT_MESSAGES.slice(-6).map(m => ({
      role: m.sender === 'user' ? 'user' : 'model',
      text: m.text
    }))
  };

  let replyText = '';
  let replySource = 'builtin';

  // 1. Try local server endpoint first
  try {
    const res = await fetch('/api/bloom-ai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      const data = await res.json();
      if (data && data.reply && (data.source === 'gemini' || data.source === 'openai')) {
        replyText = data.reply;
        replySource = data.source;
      }
    }
  } catch(err) {
    console.warn("Backend server not reachable, trying direct Gemini AI:", err.message);
  }

  // 2. If server was offline or returned non-AI fallback, call Gemini 2.5 Flash DIRECTLY from browser
  if (!replyText) {
    try {
      const directAiReply = await callGeminiDirectFromBrowser(payload);
      if (directAiReply) {
        replyText = directAiReply;
        replySource = 'gemini-browser';
      }
    } catch(directErr) {
      console.warn("Direct browser Gemini call error:", directErr.message);
    }
  }

  // 3. If offline, use client-side built-in intelligence
  if (!replyText) {
    replyText = getClientBuiltinBloomReply(payload);
    replySource = 'builtin';
  }

  if (typing) typing.style.display = 'none';

  CHAT_MESSAGES.push({
    sender: 'bloom',
    text: replyText,
    source: replySource,
    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  });

  draw();
  scrollBloomChat();
  speakYoungGirl(replyText);
}

    if (match) return match;
    match = voices.find(v => (v.lang === 'hi-IN' || v.lang.startsWith('hi')) && !isExplicitMale(v.name));
    if (match) return match;
  }

  // 2. Marathi: Native Marathi female voice first
  if (langCode === 'mr' || targetLang.startsWith('mr')) {
    let match = voices.find(v => (v.lang === 'mr-IN' || v.lang.startsWith('mr')) && isExplicitFemale(v));
    if (match) return match;

    match = voices.find(v => (v.lang === 'hi-IN' || v.lang.startsWith('hi')) && isExplicitFemale(v));

  if (langCode === 'en' || targetLang.startsWith('en')) {

  let match = voices.find(v => (v.lang.includes('IN') || v.lang.includes('in')) && isExplicitFemale(v));

    // Pitch: 1.12 preserves Indian vowel/matra clarity without high-frequency robotic clipping
    // Rate: 0.88 gives gentle, deliberate Indian speech cadence suitable for young learners
    u.pitch = 1.12;
    u.rate = 0.88;

    const langCode = overrideLang || (LANG === 1 ? 'hi' : LANG === 2 ? 'mr' : 'en');
    const targetLang = langCode === 'hi' ? 'hi-IN' : langCode === 'mr' ? 'mr-IN' : 'en-IN';
    u.lang = targetLang;

    const matchedVoice = getBestGirlVoice(targetLang, langCode);
    if (matchedVoice) {
      u.voice = matchedVoice;
      // CRITICAL FOR MARATHI & HINDI CLARITY:
      // u.lang must match matchedVoice.lang so Chromium's speech synthesizer
      // engine invokes the proper phonological model instead of falling back to English!
      u.lang = matchedVoice.lang;
    }

    let isCompleted = false;
    const triggerComplete = () => {
      if (isCompleted) return;
      isCompleted = true;
      activeSpeechUtterance = null;
      if (ACTIVE_LESSON) {
        ACTIVE_LESSON.speaking = false;
        draw();
      }
      if (onEndCallback) {
        onEndCallback();
      }
    };

    u.onstart = () => {
      if (ACTIVE_LESSON) {
        ACTIVE_LESSON.speaking = true;
        ACTIVE_LESSON.autoplayBlocked = false;
        draw();
      }
    };

    u.onend = () => {
      triggerComplete();
    };

    u.onerror = (e) => {
      if (ACTIVE_LESSON && e && e.error === 'not-allowed') {
        ACTIVE_LESSON.autoplayBlocked = true;
      }
      triggerComplete();
    };

    // Safety fallback timer based on text length (min 7.5s, roughly 9 chars/second + buffer)
    const expectedDurationMs = Math.max(7500, (text.length / 9) * 1000 + 2500);
    setTimeout(() => {
      if (!isCompleted && !window.speechSynthesis.speaking) {
        triggerComplete();
      }
    }, expectedDurationMs);

    window.speechSynthesis.speak(u);
    if (window.speechSynthesis.paused) {
      window.speechSynthesis.resume();
    }
  } catch(e) {
    if (ACTIVE_LESSON) {
      ACTIVE_LESSON.autoplayBlocked = true;
      draw();
    }
    if (onEndCallback) setTimeout(onEndCallback, 6000);
  }
}

let sceneTimer = null;
function startLesson(id) {
  clearTimeout(sceneTimer);
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  ACTIVE_LESSON = { id, step: 'vid', sc: 0, play: true, snd: true, score: 0, ans: null, q: 0, speaking: true };
  draw();
  playCurrentScene();
}

function playCurrentScene() {
  clearTimeout(sceneTimer);
  if (!ACTIVE_LESSON || ACTIVE_LESSON.step !== 'vid' || !ACTIVE_LESSON.play) return;
  const les = LESSONS[ACTIVE_LESSON.id];
  const sc = les.sc[ACTIVE_LESSON.sc];
  ACTIVE_LESSON.speaking = true;
  draw();

  const narrationText = `${sc.t[LANG]}. ${sc.d[LANG]}`;

  if (ACTIVE_LESSON.snd) {
    // Sound is ON: ONLY advance AFTER female voice narration has 100% finished speaking
    speakYoungGirl(narrationText, null, () => {
      if (!ACTIVE_LESSON || ACTIVE_LESSON.step !== 'vid' || !ACTIVE_LESSON.play) return;
      
      // Comfortable 1.2-second pause after speech completes so she can absorb the lesson
      sceneTimer = setTimeout(() => {
        advanceScene();
      }, 1200);
    });
  } else {
    // Sound is MUTED: Give ample reading time based on text length (minimum 9 seconds)
    const readingTimeMs = Math.max(9000, narrationText.length * 85);
    sceneTimer = setTimeout(() => {
      advanceScene();
    }, readingTimeMs);
  }
}

function advanceScene() {
  if (!ACTIVE_LESSON || ACTIVE_LESSON.step !== 'vid') return;
  const les = LESSONS[ACTIVE_LESSON.id];
  if (ACTIVE_LESSON.sc < les.sc.length - 1) {
    ACTIVE_LESSON.sc++;
    playCurrentScene();
  } else {
    // Last scene reached: stop speaking and advance to quiz gracefully
    ACTIVE_LESSON.speaking = false;
    draw();
    toQuiz();
  }
}

function nextScene() {
  clearTimeout(sceneTimer);
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (!ACTIVE_LESSON || ACTIVE_LESSON.step !== 'vid') return;
  const les = LESSONS[ACTIVE_LESSON.id];
  if (ACTIVE_LESSON.sc < les.sc.length - 1) {
    ACTIVE_LESSON.sc++;
    playCurrentScene();
  } else {
    toQuiz();
  }
}

function prevScene() {
  clearTimeout(sceneTimer);
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (!ACTIVE_LESSON || ACTIVE_LESSON.step !== 'vid') return;
  if (ACTIVE_LESSON.sc > 0) {
    ACTIVE_LESSON.sc--;
    playCurrentScene();
  }
}

function togglePlay() {
  if (!ACTIVE_LESSON) return;
  ACTIVE_LESSON.play = !ACTIVE_LESSON.play;
  if (!ACTIVE_LESSON.play) {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    clearTimeout(sceneTimer);
    ACTIVE_LESSON.speaking = false;
  } else {
    playCurrentScene();

  draw();
}

function toggleSound() {
  if (!ACTIVE_LESSON) return;

function toQuiz() {
  if (!ACTIVE_LESSON) return;
  clearTimeout(sceneTimer);
  if (window.speechSynthesis) window.speechSynthesis.cancel();

function selectAnswer(optIdx) {
  if (!ACTIVE_LESSON || ACTIVE_LESSON.ans !== null) return;
  const les = LESSONS[ACTIVE_LESSON.id];

function selectModalFlow(v) {
  MODAL_FLOW = v;
  const el = document.getElementById('mFlowChips');
  if (el) {
    const btns = el.querySelectorAll('button');
    btns.forEach((b, i) => {
      if (i === v) b.classList.add('on');
      else b.classList.remove('on');
    });
  }
}

function selectModalCramps(v) {
  MODAL_CRAMPS = v;
  const el = document.getElementById('mCrampsChips');
  if (el) {
    const btns = el.querySelectorAll('button');
    btns.forEach((b, i) => {
      if (i === v) b.classList.add('on');
      else b.classList.remove('on');
    });
  }
}

function saveLoggedCycle() {
  const stEl = document.getElementById('mStart');
  const enEl = document.getElementById('mEnd');
  if (!stEl || !stEl.value) return;

  const record = {
    start: stEl.value,
    end: (enEl && enEl.value) || undefined,
    flow: MODAL_FLOW,
    cramps: MODAL_CRAMPS,
    mood: MODAL_MOOD,
  };

  if (EDITING_CYCLE_INDEX !== null && CYCLES[EDITING_CYCLE_INDEX]) {
    CYCLES[EDITING_CYCLE_INDEX] = record;
  } else {
    CYCLES.push(record);
  }

  safeStorage.setItem('bloom_cycles', JSON.stringify(CYCLES));
  closeModal();
  draw();
}

function closeModal() {
  const container = document.getElementById('modalContainer');
  if (container) container.innerHTML = '';
}

  if (confirm("Are you sure you want to permanently delete all your data?")) {

    safeStorage.removeItem('bloom_progress');
    CYCLES = [];
    LESSON_PROGRESS = {};
    alert("All your data has been deleted.");
    goToTab('home');
  }
}

async function saveGeminiApiKey() {

    if (st) {
      st.style.display = 'block';

    return;
  }
  const key = inp.value.trim();

    st.style.display = 'block';
    st.innerHTML = '<span style="color:var(--mute)"><span class="bloom-pulse-dot"></span> Saving and testing Gemini AI connection...</span>';
  }

  safeStorage.setItem('bloom_gemini_key', key);
  try {
    const res = await fetch('/api/set-key', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ apiKey: key })
    });

  } catch (err) {
    if (st) {

function startDiagMeter() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert("getUserMedia is not supported on this device.");
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } })
    .then(stream => {
      DIAG_STREAM = stream;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      DIAG_CTX = new AudioCtx();
      const src = DIAG_CTX.createMediaStreamSource(stream);
      const analyser = DIAG_CTX.createAnalyser();
      analyser.fftSize = 256;
      src.connect(analyser);
      const buf = new Uint8Array(analyser.frequencyBinCount);
      const bar = document.getElementById('diagMeterBar');
      const pct = document.getElementById('diagMeterPct');

      function update() {
        analyser.getByteFrequencyData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) sum += buf[i];
        const val = Math.min(100, Math.round((sum / buf.length / 128) * 100));
        if (bar) bar.style.width = val + '%';
        if (pct) pct.textContent = val + '%';
        DIAG_ANIM = requestAnimationFrame(update);
      }
      DIAG_ANIM = requestAnimationFrame(update);
    })
    .catch(err => {
      alert("Microphone permission denied or unavailable: " + err.message);
    });
}

function stopDiagMeter() {
  if (DIAG_ANIM) cancelAnimationFrame(DIAG_ANIM);
  DIAG_ANIM = null;
  if (DIAG_STREAM) {
    DIAG_STREAM.getTracks().forEach(t => t.stop());
    DIAG_STREAM = null;
  }
  if (DIAG_CTX) {
    DIAG_CTX.close().catch(() => {});
    DIAG_CTX = null;
  }
  const bar = document.getElementById('diagMeterBar');
  const pct = document.getElementById('diagMeterPct');
  if (bar) bar.style.width = '0%';
  if (pct) pct.textContent = '0%';
}

function runDiag5sTest() {
  const btn = document.getElementById('diagRecBtn');
  const res = document.getElementById('diagRecResult');
  if (!btn || !res) return;

  btn.disabled = true;
  res.textContent = "Listening for 5 seconds... Speak now!";

  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRec) {
    const rec = new SpeechRec();
    rec.lang = LANG === 1 ? 'hi-IN' : LANG === 2 ? 'mr-IN' : 'en-IN';
    rec.start();
    let gotResult = false;
    rec.onresult = (e) => {
      gotResult = true;
      res.textContent = `Recognized: "${e.results[0][0].transcript}"`;
      btn.disabled = false;
    };
    rec.onerror = (e) => {
      res.textContent = `Capture completed or silence detected.`;
      btn.disabled = false;
    };
    setTimeout(() => {
      try { rec.stop(); } catch(e){}
      if (!gotResult && res.textContent.includes('Listening')) {
        res.textContent = "5-second test complete.";
        btn.disabled = false;
      }
    }, 5000);
  } else {
    setTimeout(() => {
      res.textContent = "Audio capture simulated successfully (Web Speech unavailable).";
      btn.disabled = false;
    }, 5000);
  }
}

function speakDiagVoice(langCode) {
  const notice = document.getElementById('diagVoiceNotice');
  if (notice) notice.textContent = `Playing ${langCode.toUpperCase()} sample narration...`;
  const texts = {

  };
  speakYoungGirl(texts[langCode] || texts.en, langCode);

  }, 4500);
}
